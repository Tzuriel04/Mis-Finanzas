<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Mis finanzas</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<meta name="theme-color" content="#0A0A0B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --bg: #0A0A0B; --box: #141416; --box2: #18181B; --line: #1E1E22; --line2: #27272A;
    --text: #EDEDED; --muted: #8A8A90; --faint: #5A5A60;
    --green: #7EE2A8; --red: #F4A3A3; --amber: #F4C77B; --alert: #F87171; --link: #93C5FD;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); max-width: 100%; height: 100%; overflow: hidden; }
  body { position: fixed; inset: 0; width: 100%; display: flex; flex-direction: column; color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Arial, sans-serif;
    font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
  .svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ---------- header ---------- */
  .top { flex: none; position: relative; z-index: 6; padding: calc(env(safe-area-inset-top) + 14px) 16px 10px;
    background: var(--bg); border-bottom: 1px solid var(--line); }
  .top { max-width: 100vw; overflow: hidden; }
  .top-in { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto;
    grid-template-areas: "menu month refresh add"; align-items: center; gap: 8px; }
  .menu-btn { grid-area: menu; justify-self: start; max-width: 100%; overflow: hidden; display: inline-flex; align-items: center; gap: 8px; background: var(--box2);
    border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 15px; }
  .menu-btn .chev { color: var(--muted); }
  .mnav { grid-area: month; display: flex; align-items: center; background: var(--box2); border-radius: 999px; padding: 3px; }
  .mnav button { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--muted); }
  .mnav .lbl { width: auto; padding: 0 10px; color: var(--text); font-weight: 500; font-size: 14px; white-space: nowrap; border-radius: 999px; }
  .rbtn { grid-area: refresh; width: 38px; height: 38px; border-radius: 50%; background: var(--box2); display: flex; align-items: center; justify-content: center; color: var(--muted); }
  .rbtn.spin .svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .addbtn { grid-area: add; display: none; align-items: center; gap: 6px; background: var(--text); color: var(--bg); border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 14px; }
  .status { max-width: 1100px; margin: 6px auto 0; font-size: 11px; color: var(--muted); min-height: 15px; }
  @media (max-width: 700px) {
    .top-in { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "menu refresh" "month month"; row-gap: 10px; }
    .mnav { justify-content: space-between; }
    .mnav .lbl { flex: 1; text-align: center; }
  }
  @media (min-width: 701px) { .addbtn { display: inline-flex; } }

  /* ---------- page menu ---------- */
  .menu-dim { position: fixed; inset: 0; z-index: 7; display: none; }
  .menu-dim.on { display: block; }
  .menu { position: absolute; z-index: 8; left: 16px; top: calc(env(safe-area-inset-top) + 64px); width: 230px; background: var(--box2); border: 1px solid var(--line2);
    border-radius: 16px; box-shadow: 0 16px 40px rgba(0,0,0,.6); overflow: hidden; display: none; }
  .menu.on { display: block; }
  .menu button { display: flex; width: 100%; justify-content: space-between; align-items: center; padding: 13px 16px; border-bottom: 1px solid var(--line2); font-size: 15px; }
  .menu button:last-child { border-bottom: 0; }
  .menu .ck { color: var(--text); }

  /* ---------- content ---------- */
  .scroller { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; }
  .wrap { max-width: 1100px; min-width: 0; overflow-x: hidden; margin: 0 auto; padding: 16px 16px calc(env(safe-area-inset-bottom) + 96px); overflow-x: hidden; }
  .cols { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px 40px; }
  .cols > div { min-width: 0; }
  .cols > div, #app, .sec, .box { min-width: 0; }
  @media (min-width: 900px) { .cols { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); } .wrap { padding-bottom: 40px; } }
  .sec { padding: 14px 0; border-bottom: 1px solid var(--line); }
  .sec:last-child { border-bottom: 0; }
  .cap { font-size: 11px; color: var(--muted); letter-spacing: .6px; text-transform: uppercase; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: center; }
  .cap button { color: var(--link); text-transform: none; letter-spacing: 0; font-size: 13px; }
  .big { font-size: 38px; font-weight: 500; letter-spacing: -1px; line-height: 1.1; }
  .mid { font-size: 26px; font-weight: 500; letter-spacing: -.5px; }
  .muted { color: var(--muted); } .small { font-size: 12px; } .tiny { font-size: 11px; }
  .pos { color: var(--green); } .neg { color: var(--red); } .neu { color: var(--muted); }
  .rowf { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .item { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .item .nm { display: flex; align-items: center; min-width: 0; flex: 1 1 auto; overflow: hidden; }
  .item .nm > span:last-child:not(.ic) { min-width: 0; flex: 1 1 auto; overflow: hidden; }
  .item .am { flex: none; }
  .rowf > * { min-width: 0; }
  .tt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ring div { margin-top: 6px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .item .tt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .sub { font-size: 12px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .am { text-align: right; white-space: nowrap; font-weight: 500; }
  .ic { width: 34px; height: 34px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; margin-right: 12px; flex: none; }
  .ic.sm { width: 26px; height: 26px; border-radius: 8px; margin-right: 9px; }
  .ic.sm .svg { width: 15px; height: 15px; }
  .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .bar div { height: 100%; border-radius: 2px; }
  .stack { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--line); }
  .legend { display: flex; flex-wrap: wrap; min-width: 0; gap: 6px 14px; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .alertbox { display: flex; gap: 10px; border-radius: 14px; padding: 11px 12px; margin-bottom: 8px; font-size: 13px; }
  .alertbox.warn { background: rgba(244,199,123,.10); border: 1px solid rgba(244,199,123,.35); }
  .alertbox.over { background: rgba(248,113,113,.10); border: 1px solid rgba(248,113,113,.4); }
  .box { background: var(--box2); border-radius: 14px; padding: 12px 14px; }
  .seg { display: grid; grid-auto-columns: 1fr; grid-auto-flow: column; background: var(--box2); border-radius: 12px; padding: 3px; margin-bottom: 12px; }
  .seg button { padding: 8px 6px; border-radius: 9px; font-size: 14px; color: var(--muted); text-align: center; }
  .seg button.on { background: var(--line2); color: var(--text); font-weight: 600; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 10px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 7px 13px; border-radius: 999px; background: var(--box2); font-size: 13px; }
  .chip.on { background: var(--text); color: var(--bg); font-weight: 600; }
  .search { display: flex; align-items: center; gap: 8px; background: var(--box2); border-radius: 12px; padding: 0 12px; margin-bottom: 10px; color: var(--muted); }
  .search input { flex: 1; background: none; border: 0; outline: none; color: var(--text); font: 16px -apple-system, Arial; padding: 11px 0; min-width: 0; }
  .dayh { font-size: 11px; color: var(--muted); letter-spacing: .6px; margin: 16px 0 2px; text-transform: uppercase; }
  .fab { position: fixed; right: max(18px, env(safe-area-inset-right)); bottom: calc(env(safe-area-inset-bottom) + 22px); z-index: 5; width: 56px; height: 56px; border-radius: 50%;
    background: var(--text); color: var(--bg); display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  .fab .svg { width: 24px; height: 24px; stroke-width: 2.2; }
  @media (min-width: 701px) { .fab { display: none; } }
  .donut { display: flex; align-items: center; gap: 18px; margin-bottom: 6px; }
  .rings { display: flex; justify-content: center; gap: 22px 28px; flex-wrap: wrap; padding: 4px 0 6px; }
  .ring { display: flex; flex-direction: column; align-items: center; width: 118px; text-align: center; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .empty { color: var(--muted); font-size: 14px; padding: 18px 0; }
  .sk { background: linear-gradient(90deg, var(--box) 0%, var(--box2) 50%, var(--box) 100%); background-size: 200% 100%; animation: sk 1.2s infinite; border-radius: 14px; margin-bottom: 12px; }
  @keyframes sk { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  .err { text-align: center; color: var(--muted); padding: 40px 16px; }
  .tap { transition: transform .12s ease, opacity .12s ease; }
  .tap:active { transform: scale(.97); opacity: .85; }

  /* ---------- bottom sheet ---------- */
  .dim { position: fixed; inset: 0; background: rgba(0,0,0,.6); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
  .dim.on { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-width: 640px; margin: 0 auto; background: var(--box2);
    border-radius: 22px 22px 0 0; max-height: 88vh; display: flex; flex-direction: column; transform: translateY(100%);
    transition: transform .42s cubic-bezier(.2, 1.12, .3, 1); padding-bottom: env(safe-area-inset-bottom); }
  .sheet.on { transform: translateY(0); }
  .dim:not(.show), .sheet:not(.show) { display: none; }
  .sh-head { padding: 10px 20px 4px; }
  .grab { width: 40px; height: 5px; background: var(--line2); border-radius: 3px; margin: 0 auto 12px; }
  .sh-title { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .sh-title h3 { margin: 0; font-size: 17px; font-weight: 600; }
  .sh-close { width: 32px; height: 32px; border-radius: 50%; background: var(--line2); display: flex; align-items: center; justify-content: center; flex: none; }
  .sh-total { font-size: 26px; font-weight: 500; margin: 6px 0 2px; }
  .sh-body { overflow-y: auto; overflow-x: hidden; padding: 6px 20px 22px; -webkit-overflow-scrolling: touch; }
  .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .6px; margin: 16px 0 4px; }
  .field { margin: 12px 0; }
  .field label { display: block; color: var(--muted); font-size: 13px; margin-bottom: 6px; }
  .field input, .field select { display: block; width: 100%; max-width: 100%; min-width: 0; margin: 0; background: var(--bg); color: var(--text);
    border: 1px solid var(--line2); border-radius: 12px; padding: 12px 14px; font: 16px -apple-system, Arial; outline: none; -webkit-appearance: none; appearance: none; }
  .field input:focus, .field select:focus { border-color: var(--link); }
  .field select { padding-right: 36px; background-image: linear-gradient(45deg, transparent 50%, #8A8A90 50%), linear-gradient(135deg, #8A8A90 50%, transparent 50%);
    background-position: calc(100% - 20px) 50%, calc(100% - 15px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
  .field input[type=date] { min-height: 48px; line-height: 22px; text-align: left; }
  .field input[type=date]::-webkit-date-and-time-value { text-align: left; margin: 0; }
  .typegrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .typegrid button { padding: 9px 4px; border-radius: 10px; background: var(--bg); font-size: 13px; text-align: center; color: var(--muted); }
  .typegrid button.on { background: var(--text); color: var(--bg); font-weight: 600; }
  .icongrid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
  .icongrid button { height: 38px; border-radius: 10px; background: var(--bg); display: flex; align-items: center; justify-content: center; color: var(--muted); }
  .colors { display: flex; gap: 10px; flex-wrap: wrap; }
  .colors button { width: 28px; height: 28px; border-radius: 50%; }
  .colors button.on { outline: 2px solid var(--text); outline-offset: 2px; }
  .btn { width: 100%; padding: 14px; border-radius: 14px; background: var(--text); color: var(--bg); font-weight: 700; font-size: 16px; margin-top: 10px; text-align: center; }
  .btn:disabled { opacity: .5; }
  .btn2 { width: 100%; padding: 12px; border-radius: 14px; background: var(--line2); color: var(--text); font-weight: 600; font-size: 15px; margin-top: 8px; text-align: center; }
  .danger { color: var(--alert); }
  .errmsg { color: var(--alert); font-size: 13px; min-height: 18px; margin-top: 6px; }
  .info { color: var(--muted); font-size: 13px; background: var(--bg); border-radius: 12px; padding: 10px 12px; margin-top: 10px; }
  .count { color: var(--muted); font-size: 12px; }
  .mrow { display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line2); gap: 8px; }
  .mini { padding: 6px 12px; border-radius: 9px; background: var(--line2); font-size: 13px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; }

  .pend { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--amber); }
  .setup { max-width: 440px; margin: 30px auto 0; }
  .setup h2 { font-size: 22px; margin: 0 0 6px; }
  .qitem { padding: 10px 0; border-bottom: 1px solid var(--line); }

  .stbox { display: block; width: 100%; background: var(--box2); border-radius: 14px; padding: 11px 12px; margin-top: 8px; }
  .tag { display: inline-block; font-size: 11px; padding: 3px 8px; border-radius: 999px; }
  .proj .rowf { padding: 5px 0; font-size: 13px; }

  /* ---------- motion and gestures ---------- */
  .bar div, .stack div { transition: width .65s cubic-bezier(.2, .8, .2, 1); }
  #app { transition: transform .22s cubic-bezier(.2, .8, .2, 1), opacity .22s ease; }
  .ptr { height: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .ptr.spin .svg { animation: spin .8s linear infinite; }
  .swrow { position: relative; overflow: hidden; border-bottom: 1px solid var(--line); }
  .swrow:last-child { border-bottom: 0; }
  .swact { position: absolute; top: 0; right: 0; bottom: 0; width: 150px; display: flex; }
  .swact button { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; text-align: center; }
  .swrow > .item { position: relative; background: var(--bg); border-bottom: 0; transition: transform .3s cubic-bezier(.2, .9, .3, 1.1); }
  .sheet .swrow > .item { background: var(--box2); }
  .sheet .swrow, .sheet .swrow:last-child { border-bottom: 1px solid var(--line2); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

  /* ---------- toast ---------- */
  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 90px); z-index: 30; max-width: 480px; margin: 0 auto;
    background: var(--line2); border-radius: 14px; padding: 13px 16px; display: none; justify-content: space-between; align-items: center; gap: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,.5); font-size: 14px; }
  .toast.on { display: flex; }
  .toast button { color: var(--link); font-weight: 600; }
  .toast .spinner { display: inline-flex; margin-right: 8px; vertical-align: -3px; }
  .toast .spinner .svg { animation: spin .8s linear infinite; }
  @media (min-width: 701px) { .toast { bottom: 30px; } }
</style>
</head>
<body>
<div class="top"><div class="top-in">
  <button class="menu-btn" data-act="menu"><span data-ic="menu"></span><span id="pageName">Inicio</span><span class="chev" data-ic="down"></span></button>
  <div class="mnav">
    <button data-act="prev" aria-label="Mes anterior"><span data-ic="left"></span></button>
    <button class="lbl" data-act="picker" id="mlabel">…</button>
    <button data-act="next" aria-label="Mes siguiente"><span data-ic="right"></span></button>
  </div>
  <button class="rbtn" id="rbtn" data-act="refresh" aria-label="Actualizar"><span data-ic="refresh"></span></button>
  <button class="addbtn" data-act="newMov"><span data-ic="plus"></span>Movimiento</button>
</div>
<div class="status" id="status">&nbsp;</div>
</div>
<div class="menu-dim" id="menuDim" data-act="menuClose"></div>
<div class="menu" id="menu"></div>

<div class="scroller" id="scroller">
  <div class="ptr" id="ptr"><span data-ic="refresh"></span><span id="ptrTx">Jala para actualizar</span></div>
  <div class="wrap" id="app">
    <div class="sk" style="height:150px"></div><div class="sk" style="height:90px"></div><div class="sk" style="height:260px"></div>
  </div>
</div>
<button class="fab" data-act="newMov" aria-label="Nuevo movimiento"><span data-ic="plus"></span></button>

<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastBtn" data-act="toastAction"></button></div>
<div class="dim" id="dim" data-act="close"></div>
<div class="sheet" id="sheet"><div class="sh-head" id="shHead"></div><div class="sh-body" id="shBody"></div></div>
<script>
// ===================== Icons (line style, inline so they load instantly) =====================
var ICONS = {
  // categories
  car: '<path d="M5 16V12l2-5h10l2 5v4z"/><path d="M5 12h14M7 16v2.5M17 16v2.5"/><circle cx="8.5" cy="14" r=".6"/><circle cx="15.5" cy="14" r=".6"/>',
  fuel: '<path d="M4 20V5a1 1 0 011-1h8a1 1 0 011 1v15M3 20h12M4 10h10M14 8l3 3v6a1.5 1.5 0 003 0V8l-3-3"/>',
  bus: '<rect x="5" y="3" width="14" height="15" rx="2"/><path d="M5 11h14M8 18v2M16 18v2"/><circle cx="8.5" cy="14.5" r=".6"/><circle cx="15.5" cy="14.5" r=".6"/>',

  home: '<path d="M4 11l8-7 8 7M6 9.5V20h12V9.5M10 20v-5h4v5"/>',
  bulb: '<path d="M9 18h6M10 21h4M12 3a6 6 0 00-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0012 3z"/>',
  wifi: '<path d="M5 12.5a10 10 0 0114 0M8 15.5a6 6 0 018 0M2 9.5a14 14 0 0120 0"/><circle cx="12" cy="18.5" r=".8"/>',
  phone: '<rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 17.5h2"/>',
  tv: '<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M8 21h8M9 3l3 3 3-3"/>',
  health: '<path d="M3 12h4l2-5 4 10 2-5h6"/>',
  pill: '<path d="M8.5 19.5a4.2 4.2 0 01-6-6l8-8a4.2 4.2 0 016 6z"/><path d="M8.5 8.5l6 6"/>',
  gym: '<path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"/>',
  shirt: '<path d="M8 3L3 6l2 4 2-1v12h10V9l2 1 2-4-5-3a4 4 0 01-8 0z"/>',
  scissors: '<circle cx="6" cy="7" r="3"/><circle cx="6" cy="17" r="3"/><path d="M8.6 8.6L20 18M8.6 15.4L20 6"/>',
  school: '<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.5 3 3 6 3s6-1.5 6-3v-5M22 9v6"/>',
  book: '<path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2z"/><path d="M4 19a2 2 0 012-2h13"/>',
  plane: '<path d="M3 11l18-7-7 18-3-8z"/><path d="M11 14l10-10"/>',

  var p = Math.max(0, Math.min(1, pct || 0)), c = 94.2;
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="none" stroke="#1E1E22" stroke-width="3"/>' +
    '<circle cx="18" cy="18" r="15" fill="none" stroke="' + color + '" stroke-width="3" stroke-linecap="round" stroke-dasharray="' + (p * c).toFixed(1) + ' ' + c + '" transform="rotate(-90 18 18)"/>' +
    '<text x="18" y="21" text-anchor="middle" font-size="8" fill="#EDEDED">' + Math.round(p * 100) + '%</text></svg>';
}
function stackBar(groups, total, colorOf) {
  if (!total) return '<div class="stack"></div>';
  return '<div class="stack">' + groups.map(function (g) {
    return '<div style="width:' + (g.value / total * 100).toFixed(2) + '%;background:' + colorOf(g.name) + '"></div>';
  }).join('') + '</div>';
}

// ===================== Pages =====================
function render() {
  if (!getCfg() || !D) { document.getElementById('app').innerHTML = getCfg() ? '<div class="empty">Cargando…</div>' : setupHtml(); return; }
  var name = PAGES.filter(function (p) { return p[0] === PAGE; })[0][1];
  document.getElementById('pageName').textContent = name;
  document.getElementById('mlabel').textContent = PAGE === 'anio' ? String(S.y) : monthName() + ' ' + S.y;
  var html = { inicio: pageInicio, movs: pageMovs, gastos: pageGastos, cuentas: pageCuentas, cats: pageCats, anio: pageAnio, ajustes: pageAjustes }[PAGE]();
  document.getElementById('app').innerHTML = html;
  if (PAGE === 'movs') renderMovList();
  animateIn();
}

// ---------- Inicio ----------
function pageInicio() {
  var ym = key(S.y, S.m), cur = monthTotals(S.y, S.m);
  var current = isCurrentMonth();
  var day = Number(D.today.slice(8, 10)), dim = daysInMonth(S.y, S.m);

  // Budget alerts (from 80%)
  var spent = groupMap(ym, 'cat');
  var alerts = D.categories.filter(function (c) { return c.kind === 'Gasto' && c.budget > 0 && (spent[c.name] || 0) >= 0.8 * c.budget; })
    .map(function (c) { return { c: c, p: spent[c.name] / c.budget }; }).sort(function (a, b) { return b.p - a.p; }).slice(0, 2);
  var alertHtml = alerts.map(function (a) {
    var over = a.p > 1;
    return '<button class="alertbox ' + (over ? 'over' : 'warn') + ' tap" style="width:100%" data-act="cat" data-arg="' + esc(a.c.name) + '">' +
      '<span style="color:' + (over ? 'var(--alert)' : 'var(--amber)') + '">' + icon('alert') + '</span><span><b style="font-weight:600">' + esc(a.c.name) +
      (over ? ' se pasó' : ' va en ' + Math.round(a.p * 100) + '%') + '</b> de su presupuesto (' + money(spent[a.c.name]) + ' de ' + money(a.c.budget) + ')' +
      (current && !over ? ' y faltan ' + (dim - day) + ' días.' : '.') + '</span></button>';
  }).join('');

  // Spending curve and projection
  var daily = [], acc = 0;
  for (var d = 1; d <= dim; d++) {
    var dk = ym + '-' + pad(d);
    acc += D.paid.reduce(function (t, p) { return t + (p.day === dk ? p.monto : 0); }, 0);
    daily.push(acc);
  }
  var upto = current ? day : dim;
  var projection = current && day >= 3 && cur.gas > 0 ? cur.gas / day * dim : null;
  var maxY = Math.max(projection || 0, daily[dim - 1] || 0, 1);
  var W = 300, H = 56, pts = [];
  for (var i = 0; i < upto; i++) pts.push((i / (dim - 1) * W).toFixed(1) + ',' + (H - 4 - daily[i] / maxY * (H - 10)).toFixed(1));
  var curve = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="' + H + '" preserveAspectRatio="none" style="margin:6px 0 4px">' +
    (projection ? '<polyline points="' + pts[pts.length - 1] + ' ' + W + ',' + (H - 4 - projection / maxY * (H - 10)).toFixed(1) + '" fill="none" stroke="#5A5A60" stroke-width="1.5" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>' : '') +
    '<polyline points="' + pts.join(' ') + '" fill="none" stroke="#EDEDED" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>';
  var save = cur.ing > 0 ? Math.round((cur.ing - (projection || cur.gas)) / cur.ing * 100) : null;

  var head = '<div class="sec">' + alertHtml +
    '<div class="muted small">Gastado ' + (current ? 'este mes' : 'en ' + monthName().toLowerCase()) + '</div>' +
    '<button class="big tap" data-act="gastos" data-count="' + cur.gas + '">' + money(cur.gas) + '</button>' + curve +
    (projection ? '<div class="small muted">A este ritmo cierras el mes en <span style="color:var(--text)">' + money(projection) + '</span></div>' : '') +
    '<div class="small muted" style="margin-top:2px">Ingresos ' + (cur.ing ? '<span class="pos">+' + money(cur.ing) + '</span>' : '-') +
    (save !== null ? ' · ' + (projection ? 'ahorro proyectado ' : 'ahorras ') + save + '%' : '') + '</div></div>';

  // Categories
  var groups = paidGroups(ym, 'cat'), total = groups.reduce(function (t, g) { return t + g.value; }, 0);
  var catsHtml = '<div class="sec"><div class="cap">En qué gastaste<button data-act="go" data-arg="gastos">Ver todo</button></div>' +
    (groups.length ? stackBar(groups, total, function (n) { return catStyle(n).color; }) +
      '<div class="legend">' + groups.slice(0, 5).map(function (g) {
        var st = catStyle(g.name);
        return '<span><span style="color:' + st.color + '">' + icon(st.icon, 14) + '</span>' + esc(g.name) + ' ' + Math.round(g.value / total * 100) + '%</span>';
      }).join('') + '</div>' : '<div class="empty">Sin gastos este mes.</div>') + '</div>';

  // Cards and balances follow the selected month
  var money2 = moneySection(true);

  var recent = D.movs.slice().sort(byNewest).slice(0, 5);
  var recentHtml = '<div class="sec"><div class="cap">Recientes<button data-act="go" data-arg="movs">Ver todos</button></div>' +
    (recent.length ? recent.map(function (x) { return txItem(x, true); }).join('') : '<div class="empty">Aún no hay movimientos.</div>') + '</div>';

  return '<div class="cols"><div>' + head + catsHtml + '</div><div>' + money2 + recentHtml + '</div></div>';
}

// ---------- Movimientos ----------
function pageMovs() {
  var chips = [['todos', 'Todos'], ['gastos', 'Gastos'], ['ingresos', 'Ingresos'], ['tarjetas', 'Tarjetas'], ['pagos', 'Pagos'], ['transf', 'Transferencias']];
  return '<div class="search">' + icon('search') + '<input id="search" type="search" placeholder="Buscar comercio, categoría o cuenta" value="' + esc(SEARCH) + '" autocomplete="off"></div>' +
    '<div class="chips">' + chips.map(function (c) {
      return '<button class="chip' + (MOV_FILTER === c[0] ? ' on' : '') + '" data-act="movFilter" data-arg="' + c[0] + '">' + c[1] + '</button>';
    }).join('') + '</div><div id="movList"></div>';
}
function movMatches(x) {
  var f = MOV_FILTER;
  if (f === 'gastos' && !(x.tipo === 'Gasto' || x.tipo === 'Compra TC')) return false;
  if (f === 'ingresos' && x.tipo !== 'Ingreso') return false;
  if (f === 'tarjetas' && !(x.tipo === 'Compra TC' || x.tipo === 'Reembolso TC' || x.tipo === 'Pago TC')) return false;
  if (f === 'pagos' && x.tipo !== 'Pago TC') return false;
  if (f === 'transf' && x.tipo !== 'Transferencia') return false;
  if (SEARCH) {
    var q = SEARCH.toLowerCase();
    return [x.desc, x.cat, x.cuenta, x.destino, x.tipo].join(' ').toLowerCase().indexOf(q) >= 0;
  }
  return true;
}
function renderMovList() {
  var ym = key(S.y, S.m);
  var items = D.movs.filter(function (x) { return (SEARCH || inMonth(ym)(x)) && movMatches(x); }).sort(byNewest);
  var html = SEARCH ? '<div class="small muted" style="margin:4px 0">Resultados en todos los meses · ' + items.length + '</div>' : '';
  var lastDay = '';
  items.forEach(function (x) {
    if (x.day !== lastDay) {
      lastDay = x.day;
      var label = x.day === D.today ? 'Hoy · ' : '';
      html += '<div class="dayh">' + label + Number(x.day.slice(8, 10)) + ' ' + monthName(Number(x.day.slice(5, 7))).slice(0, 3) + (SEARCH ? ' ' + x.day.slice(0, 4) : '') + '</div>';
    }
    html += txItem(x, false);
  });
  if (!items.length) html += '<div class="empty">' + (SEARCH ? 'Nada coincide con tu búsqueda.' : 'Sin movimientos en este mes.') + '</div>';
  document.getElementById('movList').innerHTML = html;
}

// ---------- Gastos ----------
function pageGastos() {
  var ym = key(S.y, S.m), prev = shift(S.y, S.m, -1), pym = key(prev.y, prev.m);
  var items = expenseItems();
  var groups = groupsFrom(items, ym, GROUP), total = groups.reduce(function (t, g) { return t + g.value; }, 0);
  var prevMap = {}; groupsFrom(items, pym, GROUP).forEach(function (g) { prevMap[g.name] = g.value; });
  var prevTotal = items.reduce(function (t, p) { return t + (inMonth(pym)(p) ? p.monto : 0); }, 0);
  var colorOf = function (n) { return GROUP === 'cat' ? catStyle(n).color : PALETTE[D.accounts.map(function (a) { return a.name; }).indexOf(n) % PALETTE.length] || '#8A8A90'; };

  var acc = 0, rings = groups.map(function (g) {
    var len = g.value / total * 100, off = 25 - acc; acc += len;
    return '<circle cx="21" cy="21" r="15.9155" fill="none" stroke="' + colorOf(g.name) + '" stroke-width="5" stroke-dasharray="' + len.toFixed(2) + ' ' + (100 - len).toFixed(2) + '" stroke-dashoffset="' + off.toFixed(2) + '"/>';
  }).join('');

  var rows = groups.map(function (g) {
    var box = GROUP === 'cat' ? icBox(catStyle(g.name).icon, catStyle(g.name).color) : accBox(g.name);
    var c = GROUP === 'cat' ? findCat(g.name) : null;
    var budget = c && c.budget > 0 ? '<div class="sub" style="margin:4px 0 4px 46px">' + money(g.value) + ' de ' + money(c.budget) + ' · ' + Math.round(g.value / c.budget * 100) + '%</div>' +
      '<div class="bar" style="margin-left:46px"><div style="width:' + Math.min(100, g.value / c.budget * 100) + '%;background:' + budgetColor(g.value / c.budget) + '"></div></div>' : '';
    return '<button class="tap" style="display:block;width:100%;padding:11px 0;border-bottom:1px solid var(--line)" data-act="' + (GROUP === 'cat' ? 'cat' : 'medio') + '" data-arg="' + esc(g.name) + '">' +
      '<div class="rowf"><span class="nm" style="display:flex;align-items:center">' + box + esc(g.name) + '</span>' +
      '<span style="text-align:right;font-weight:500">' + money(g.value) + '<div class="tiny">' + deltaHtml(g.value, prevMap[g.name] || 0) + '</div></span></div>' + budget + '</button>';
  }).join('');

  var basisInfo = BASIS === 'compra'
    ? 'Incluye las compras con TC en la fecha en que las hiciste. Para ver solo lo que ya salió de tus cuentas, elige "Según pago".'
    : 'Las compras con TC cuentan cuando pagas la tarjeta. Compras con TC este mes: ' + money(cardPurchases(ym)) + '.';
  return '<div class="seg" style="max-width:420px"><button data-act="basis" data-arg="compra" class="' + (BASIS === 'compra' ? 'on' : '') + '">Según compra</button>' +
    '<button data-act="basis" data-arg="pago" class="' + (BASIS === 'pago' ? 'on' : '') + '">Según pago</button></div>' +
    '<div class="seg" style="max-width:420px"><button data-act="group" data-arg="cat" class="' + (GROUP === 'cat' ? 'on' : '') + '">Categoría</button>' +
    '<button data-act="group" data-arg="medio" class="' + (GROUP === 'medio' ? 'on' : '') + '">Medio de pago</button></div>' +
    (groups.length ? '<div class="cols"><div><div class="donut"><svg width="104" height="104" viewBox="0 0 42 42">' + rings + '</svg>' +
      '<div><div class="small muted">Total de ' + monthName().toLowerCase() + '</div><div class="mid" data-count="' + total + '">' + money(total) + '</div>' +
      '<div class="small">' + deltaHtml(total, prevTotal) + ' <span class="muted">vs ' + monthName(prev.m).toLowerCase() + '</span></div></div></div>' +
      '<div class="info" style="margin-bottom:10px">' + basisInfo + '</div></div>' +
      '<div>' + rows + '</div></div>' : '<div class="empty">Sin gastos en ' + monthName().toLowerCase() + '.</div>');
}

// ---------- Cuentas y tarjetas ----------
// Balances, card limits, this month's statements and (for future months) the projection.
function moneySection(onInicio) {
  var per = period(), cards = accts('Crédito');
  var at = per.kind === 'past' ? per.asOf : D.today;
  var disp = accts('Débito').reduce(function (t, a) { return t + debitBalance(a, at); }, 0);
  var deuda = cards.reduce(function (t, a) { return t + cardDebt(a, at); }, 0);
  var when = per.kind === 'past' ? 'al ' + dayLabel(per.asOf) : 'hoy';
  var html = '';
  if (onInicio) {
    var withCupo = cards.filter(function (a) { return a.cupo > 0; });
    if (withCupo.length) html += '<div class="cap">Cupo usado ' + when + '</div><div class="rings" style="margin-bottom:12px">' + withCupo.map(function (a) {
      var u = usage(cardDebt(a, at), a.cupo);
      return '<button class="ring tap" data-act="go" data-arg="cuentas">' + ringSvg(u.pct, u.color, 84) + '<div>' + esc(a.name.replace(/^TC\s+/i, '')) + '</div></button>';
    }).join('') + '</div>';
  }
  var row = function (ic, label, value, extra) {
    return '<button class="item tap" data-act="go" data-arg="cuentas"><span class="nm"><span class="ic sm" style="background:var(--box2);color:#A1A1AA">' + icon(ic) + '</span>' +
      '<span class="tt">' + label + '</span></span><span class="am"' + (extra || '') + '>' + money(value) + '</span></button>';
  };
  if (per.kind === 'future') {
    var dues = duesUntil(per.end), total = dues.reduce(function (t, s) { return t + s.remaining; }, 0);
    html += '<div class="cap">Disponible proyectado al ' + dayLabel(per.end) + '</div>' +
      '<div class="mid" data-count="' + (disp - total) + '">' + money(disp - total) + '</div>' +
      '<div class="tiny muted" style="margin-bottom:6px">Si pagas tus tarjetas a tiempo</div>' +
      '<div class="box proj"><div class="rowf"><span class="muted">Disponible hoy</span><span>' + money(disp) + '</span></div>' +
      (dues.length ? dues.map(function (s) {
        return '<div class="rowf"><span class="muted">− ' + esc(s.card.name.replace(/^TC\s+/i, '')) + ' · ' + dayLabel(s.due) + (s.closed ? '' : ' (abierto)') + '</span><span class="neg">−' + money(s.remaining) + '</span></div>';
      }).join('') : '<div class="rowf"><span class="muted">Sin pagos de tarjeta pendientes</span><span>$0</span></div>') + '</div>' +
      row('card', 'Deuda tarjetas hoy', deuda);
  } else {
    html += row('bank', 'Disponible ' + when, disp) + row('card', 'Deuda tarjetas ' + when, deuda);
    if (per.kind === 'current') {
      var dm = duesUntil(per.end), dt = dm.reduce(function (t, s) { return t + s.remaining; }, 0);
      if (dt) html += '<div class="tiny muted" style="padding:6px 0 0">Después de pagar lo que vence este mes: <span style="color:var(--text)">' + money(disp - dt) + '</span></div>';
    }
  }
  if (cards.length && onInicio) html += '<div class="cap" style="margin-top:14px">Tarjetas · extracto de ' + monthName().toLowerCase() + '</div>' +
    cards.map(function (c) { return statementBox(c, S.y, S.m); }).join('');
  return '<div class="sec">' + html + '</div>';
}

function pageCuentas() {
  var deb = accts('Débito'), cred = accts('Crédito');
  var per = period(), at = per.kind === 'past' ? per.asOf : D.today, when = per.kind === 'past' ? 'al ' + dayLabel(per.asOf) : 'hoy';
  var disp = deb.reduce(function (t, a) { return t + debitBalance(a, at); }, 0);
  var deuda = cred.reduce(function (t, a) { return t + cardDebt(a, at); }, 0);
  var left = '<div class="sec"><div class="cap">Disponible ' + when + '<button data-act="manage">Administrar</button></div><div class="mid" style="margin-bottom:6px" data-count="' + disp + '">' + money(disp) + '</div>' +
    deb.map(function (a) {
      return '<button class="item tap" data-act="cuenta" data-arg="' + esc(a.name) + '"><span class="nm">' + accBox(a.name) + '<span class="tt">' + esc(a.name) + '</span></span><span class="am">' + fmt(debitBalance(a, at)) + '</span></button>';
    }).join('') + '</div>' + (per.kind === 'future' ? moneySection(false) : '');
  var right = '<div class="sec"><div class="cap">Deuda tarjetas ' + when + '</div><div class="mid" style="margin-bottom:6px" data-count="' + deuda + '">' + money(deuda) + '</div>' +
    cred.map(function (a) {
      var d = cardDebt(a, at), u = usage(d, a.cupo), pend = (D.pending && D.pending[a.name]) || [];
      var pendTotal = pend.reduce(function (t, p) { return t + p.monto; }, 0), open = OPEN_CARD[a.name];
      var html = '<div style="padding:11px 0;border-bottom:1px solid var(--line)">' +
        '<button class="rowf tap" style="width:100%" data-act="tarjeta" data-arg="' + esc(a.name) + '"><span class="nm" style="display:flex;align-items:center">' + accBox(a.name) + '<span class="tt">' + esc(a.name) + '</span></span><span style="font-weight:500">' + money(d) + '</span></button>';
      if (a.cupo > 0) {
        html += '<div class="bar" style="margin:8px 0 4px 46px"><div style="width:' + Math.min(100, Math.max(2, u.pct * 100)) + '%;background:' + u.color + '"></div></div>' +
          '<div class="rowf tiny muted" style="margin-left:46px"><span style="color:' + u.color + '">' + Math.round(u.pct * 100) + '% de ' + money(a.cupo) + '</span><span>Disponible ' + short(a.cupo - d) + '</span></div>';
      }
      html += '<div style="margin-left:46px">' + statementBox(a, S.y, S.m) + '</div>';
      if (pend.length) {
        var groups = {}, list = open ? (EXPAND_CARD[a.name] ? pend : pend.slice(0, 3)) : [];
        pend.forEach(function (p) { groups[p.cat] = (groups[p.cat] || 0) + p.monto; });
        var garr = Object.keys(groups).map(function (k) { return { name: k, value: groups[k] }; }).sort(function (x, y) { return y.value - x.value; });
        html += '<div class="box" style="margin:10px 0 0 46px;padding:10px 12px">' +
          '<button class="rowf tap" style="width:100%" data-act="togglePend" data-arg="' + esc(a.name) + '"><span class="tiny muted" style="letter-spacing:.6px">POR PAGAR · ' + pend.length + ' COMPRA(S)</span>' +
          '<span style="display:flex;align-items:center;gap:6px;font-weight:500">' + money(pendTotal) + '<span class="muted">' + icon(open ? 'up' : 'down', 16) + '</span></span></button>';
        if (open) {
          html += '<div class="tiny muted" style="margin:8px 0 2px">Cuando pagues, entran a tus gastos en este orden:</div>' +
            list.map(function (p) {
              var st = catStyle(p.cat);
              return '<' + (p.row ? 'button data-act="editMov" data-arg="' + p.row + '"' : 'div') + ' class="rowf tap" style="width:100%;padding:6px 0">' +
                '<span style="display:flex;align-items:center;min-width:0">' + icBox(st.icon, st.color, true) + '<span class="tt small">' + esc(p.desc || p.cat) + (p.day ? ' · ' + ddmm(p.day) : '') + '</span></span>' +
                '<span class="small">' + money(p.monto) + '</span></' + (p.row ? 'button' : 'div') + '>';
            }).join('') +
            (pend.length > 3 && !EXPAND_CARD[a.name] ? '<button class="small tap" style="color:var(--link);padding:4px 0" data-act="expandPend" data-arg="' + esc(a.name) + '">+ ' + (pend.length - 3) + ' compra(s) más</button>' : '') +
            '<div style="margin-top:8px">' + stackBar(garr, pendTotal, function (n) { return catStyle(n).color; }) + '</div>' +
            '<div class="tiny muted" style="margin-top:4px">' + garr.slice(0, 3).map(function (g) { return esc(g.name) + ' ' + Math.round(g.value / pendTotal * 100) + '%'; }).join(' · ') + '</div>';
        }
        html += '</div>';
      } else if (d <= 0) {
        html += '<div class="tiny muted" style="margin:6px 0 0 46px">Nada por pagar.</div>';
      }
      return html + '</div>';
    }).join('') + '</div>';
  return '<div class="cols"><div>' + left + '</div><div>' + right + '</div></div>';
}

// ---------- Categorías ----------
function pageCats() {
  var all = D.categories || [];
  var ym = key(S.y, S.m), spent = groupMap(ym, 'cat');
  var count = function (k) { return all.filter(function (c) { return k === 'oculta' ? c.hidden : (!c.hidden && c.kind === k); }).length; };
  var list = all.filter(function (c) { return CAT_TAB === 'oculta' ? c.hidden : (!c.hidden && c.kind === CAT_TAB); });
  var rows = list.map(function (c) {
    var st = catStyle(c.name), sub;
    if (c.hidden) sub = c.kind + ' · oculta';
    else if (c.kind === 'Ingreso') {
      var ing = sum(D.movs, function (x) { return inMonth(ym)(x) && x.tipo === 'Ingreso' && x.cat === c.name; });
      sub = ing ? 'Este mes +' + money(ing) : 'Sin ingresos este mes';
    } else sub = c.budget > 0 ? money(c.budget) + '/mes · este mes ' + Math.round((spent[c.name] || 0) / c.budget * 100) + '%' : 'Sin presupuesto';
    return '<button class="item tap" data-act="editCat" data-arg="' + esc(c.name) + '"><span class="nm">' + icBox(st.icon, st.color) +
      '<span style="min-width:0"><div class="tt">' + esc(c.name) + '</div><div class="sub">' + esc(sub) + '</div></span></span><span class="muted">' + icon('right', 16) + '</span></button>';
  }).join('');
  return '<div class="rowf" style="margin-bottom:12px"><div class="seg" style="flex:1;margin:0;max-width:460px">' +
    [['Gasto', 'Gastos'], ['Ingreso', 'Ingresos'], ['oculta', 'Ocultas']].map(function (t) {
      return '<button data-act="catTab" data-arg="' + t[0] + '" class="' + (CAT_TAB === t[0] ? 'on' : '') + '">' + t[1] + ' · ' + count(t[0]) + '</button>';
    }).join('') + '</div><button class="tap" style="color:var(--link);display:flex;align-items:center;gap:4px;white-space:nowrap" data-act="newCat">' + icon('plus', 16) + 'Nueva</button></div>' +
    (rows || '<div class="empty">' + (CAT_TAB === 'oculta' ? 'No tienes categorías ocultas.' : 'Sin categorías.') + '</div>') +

}

function closeSheet() {

// Persistent message while something is being saved on the sheet

function hideToast() { clearTimeout(TOAST_TIMER); document.getElementById('toast').classList.remove('on'); TOAST_FN = null; }
function toast(msg, label, fn) {

  document.getElementById('toastMsg').textContent = msg;

function setStatus(text) { document.getElementById('status').textContent = text; }

// Calls a server function; on success refreshes the data, re-renders and runs opts.done.
function callServer(fn, args, opts) {
  opts = opts || {};
  var btn = opts.btn ? document.getElementById(opts.btn) : null, label = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Guardando…'; }
  busy(opts.busy || 'Guardando cambios…');
  rpc(fn, args).then(function (data) {
    hideToast();
    setData(data);
    LAST_LOAD = Date.now();
    setStatus(statusText());
    render();
    if (opts.done) opts.done(data); else closeSheet();
    if (opts.ok) toast(opts.ok);
  }).catch(function (e) {
    hideToast();
    setStatus(statusText());
    if (btn) { btn.disabled = false; btn.textContent = label; }
    var msg = e.offline ? 'Necesitas internet para esto. Los movimientos nuevos sí se pueden registrar sin conexión.' : e.message;
    var el = opts.err ? document.getElementById(opts.err) : null;
    if (el) el.textContent = msg; else toast(e.offline ? 'Sin conexión: necesitas internet para esto.' : 'No se pudo guardar: ' + e.message);
  });
}
// Instant change: applied on the phone right away and confirmed with the sheet in the background.
// If the sheet rejects it (or the connection drops), the change is undone and you're told why.
var INFLIGHT = 0;
var OFFLINE_MSG = 'Necesitas internet para esto. Los movimientos nuevos sí se pueden registrar sin conexión.';
function instant(fn, args, apply, opts) {
  opts = opts || {};
  var fail = function (msg) { var el = opts.err && document.getElementById(opts.err); if (el) el.textContent = msg; else toast(msg); };
  if (navigator.onLine === false || !SERVER) { fail(OFFLINE_MSG); return; }
  var snapshot = JSON.stringify(SERVER);
  try { apply(SERVER); } catch (e) { SERVER = JSON.parse(snapshot); fail(e.message); return; }
  saveLocal(); derive(); render();
  if (opts.after) opts.after(); else closeSheet();
  if (opts.ok) toast(opts.ok, opts.undoLabel, opts.undo);
  INFLIGHT++; setStatus('Guardando en tu hoja…');
  rpc(fn, args).then(function (data) {
    INFLIGHT--;
    if (!INFLIGHT) { setData(data); LAST_LOAD = Date.now(); render(); }
    setStatus(statusText());
  }).catch(function (e) {
    INFLIGHT--;
    SERVER = JSON.parse(snapshot); saveLocal(); derive(); render();
    setStatus(statusText());
    toast(e.offline ? 'Se perdió la conexión y el cambio se deshizo.' : 'No se pudo guardar: ' + e.message + ' El cambio se deshizo.');
  });
}
function saveLocal() { try { localStorage.setItem(CACHE_KEY, JSON.stringify({ saved: Date.now(), data: SERVER })); } catch (e) { /* storage full */ } }

  srv.lists.categoriasGasto = vis.filter(function (c) { return c.kind === 'Gasto'; }).map(function (c) { return c.name; });
  srv.lists.categoriasIngreso = vis.filter(function (c) { return c.kind === 'Ingreso'; }).map(function (c) { return c.name; });
  srv.lists.cuentasDebito = act.filter(function (a) { return a.type === 'Débito'; }).map(function (a) { return a.name; });

}
var APPLY = {
  movUpdate: function (row, d) { return function (srv) {

  movRestore: function (m) { return function (srv) { srv.movs.push(JSON.parse(JSON.stringify(m))); }; },
  catUpdate: function (old, ch) { return function (srv) {
    var c = srv.categories.filter(function (x) { return x.name === old; })[0];
    if (!c) throw new Error('No encontré la categoría.');
    var nn = ch.name != null ? String(ch.name).trim() : c.name;

  catRestore: function (c) { return function (srv) { srv.categories.push(JSON.parse(JSON.stringify(c))); rebuildLists(srv); }; },
  accArchive: function (name, on) { return function (srv) { srv.accounts.forEach(function (a) { if (a.name === name) a.archived = on; }); rebuildLists(srv); }; },
  accUpdate: function (old, nn, ini, cupo, corte, pago) { return function (srv) {

    var q = queueGet(), it = q.filter(function (i) { return i.id === MOV.mov.qid; })[0];
    if (it) { it.data = data; delete it.error; queueSet(q); }
  } else {
    var q2 = queueGet();
    q2.push({ id: 'app-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8), data: data, created: Date.now() });
    queueSet(q2);
  }
  derive(); render(); closeSheet();
  flushQueue(true);
}

// Both empty = not configured; otherwise both must be days 1-31.
function readCycleDays(idC, idP, errId) {
  var c = document.getElementById(idC), p = document.getElementById(idP);
  if (!c || !p) return { corte: null, pago: null };
  var cv = String(c.value).trim(), pv = String(p.value).trim();
  if (!cv && !pv) return { corte: 0, pago: 0 };
  var cn = Number(cv), pn = Number(pv);
  if (!(cn >= 1 && cn <= 31 && pn >= 1 && pn <= 31) || cn % 1 || pn % 1) {
    document.getElementById(errId).textContent = 'Escribe el día de corte y el de pago (de 1 a 31).';
    return false;
  }
  return { corte: cn, pago: pn };
}

var ANIMATE = true;   // play entry animations on the next render (page, month or first load)
var REDUCE = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

// Numbers count up, bars grow, rings and the donut draw themselves.
function animateIn() {
  if (!ANIMATE || !D) return;
  ANIMATE = false;
  if (REDUCE) return;
  var app = document.getElementById('app');
  Array.prototype.forEach.call(app.querySelectorAll('[data-count]'), function (el) {
    var to = Number(el.getAttribute('data-count')) || 0, t0 = null;
    var step = function (t) {
      if (!t0) t0 = t;
      var p = Math.min(1, (t - t0) / 650), e = 1 - Math.pow(1 - p, 3);
      el.textContent = money(to * e);
      if (p < 1) requestAnimationFrame(step);
    };
    el.textContent = money(0);
    requestAnimationFrame(step);
  });
  var bars = app.querySelectorAll('.bar > div, .stack > div');
  Array.prototype.forEach.call(bars, function (b) { b.dataset.w = b.style.width; b.style.transition = 'none'; b.style.width = '0'; });
  var circles = app.querySelectorAll('svg circle[stroke-dasharray]');
  Array.prototype.forEach.call(circles, function (c) {
    var d = c.getAttribute('stroke-dasharray'), total = d.split(/[ ,]+/).map(Number).reduce(function (s, v) { return s + v; }, 0);
    c.dataset.d = d; c.style.transition = 'none'; c.style.strokeDasharray = '0 ' + total;
  });
  void app.offsetWidth;
  requestAnimationFrame(function () {
    Array.prototype.forEach.call(bars, function (b) { b.style.transition = ''; b.style.width = b.dataset.w; });
    Array.prototype.forEach.call(circles, function (c) { c.style.transition = 'stroke-dasharray .8s cubic-bezier(.2,.8,.2,1)'; c.style.strokeDasharray = c.dataset.d; });
  });
}
function shiftPeriod(dir) { if (PAGE === 'anio') S.y += dir; else S = shift(S.y, S.m, dir); }
// Page or month change: the content slides (dir = 1 / -1) or fades (dir = 0)
function slide(dir, change) {
  var app = document.getElementById('app');
  if (REDUCE || !D) { change(); ANIMATE = true; render(); return; }
  app.style.transition = 'transform .14s ease, opacity .14s ease';
  app.style.opacity = '0';
  app.style.transform = dir ? 'translateX(' + (-dir * 40) + 'px)' : 'translateY(6px)';
  setTimeout(function () {
    change(); ANIMATE = true; render();
    app.style.transition = 'none';
    app.style.transform = dir ? 'translateX(' + (dir * 40) + 'px)' : 'translateY(6px)';
    void app.offsetWidth;
    app.style.transition = ''; app.style.opacity = '1'; app.style.transform = '';
  }, 140);
}

// ===================== Gestures (iPhone) =====================
// Pull down to refresh · swipe the page sideways to change month · swipe a movement to edit or delete.
var OPEN_ROW = null, SUPPRESS_CLICK = false;
function closeRow() { if (OPEN_ROW) { OPEN_ROW.style.transform = ''; OPEN_ROW = null; } }
document.addEventListener('click', function (e) {
  if (SUPPRESS_CLICK) { SUPPRESS_CLICK = false; e.stopPropagation(); e.preventDefault(); return; }
  if (OPEN_ROW && !e.target.closest('.swact')) { closeRow(); e.stopPropagation(); e.preventDefault(); }
}, true);
(function () {
  var sc = document.getElementById('scroller'), ptr = document.getElementById('ptr');
  var x0 = 0, y0 = 0, mode = null, fg = null, base = 0, top0 = 0;
  var suppress = function () { SUPPRESS_CLICK = true; setTimeout(function () { SUPPRESS_CLICK = false; }, 350); };
  sc.addEventListener('touchstart', function (e) {
    var t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; mode = null; top0 = sc.scrollTop;
    var row = e.target.closest('.swrow'); fg = row ? row.querySelector(':scope > .item') : null;
    base = fg && fg === OPEN_ROW ? -150 : 0;
  }, { passive: true });
  sc.addEventListener('touchmove', function (e) {
    if (!D) return;
    var t = e.touches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    if (!mode) {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      var blocked = e.target.closest('.chips, .seg, input, select, .search, .typegrid');
      if (Math.abs(dx) > Math.abs(dy) * 1.3 && !blocked) mode = fg ? 'row' : (PAGE !== 'ajustes' ? 'month' : 'none');
      else if (dy > 0 && top0 <= 0 && sc.scrollTop <= 0) mode = 'pull';
      else mode = 'none';
      if (OPEN_ROW && OPEN_ROW !== fg) closeRow();
    }
    if (mode === 'row') {
      e.preventDefault(); fg.style.transition = 'none';
      fg.style.transform = 'translateX(' + Math.max(-190, Math.min(0, base + dx)) + 'px)';
    } else if (mode === 'month') {
      e.preventDefault();
      var app = document.getElementById('app');
      app.style.transition = 'none'; app.style.transform = 'translateX(' + dx * 0.35 + 'px)';
      app.style.opacity = String(1 - Math.min(0.5, Math.abs(dx) / 400));
    } else if (mode === 'pull') {
      e.preventDefault();
      var hgt = Math.min(80, dy * 0.45);
      ptr.style.transition = 'none'; ptr.style.height = hgt + 'px';
      document.getElementById('ptrTx').textContent = hgt >= 56 ? 'Suelta para actualizar' : 'Jala para actualizar';
    }
  }, { passive: false });
  sc.addEventListener('touchend', function (e) {
    var t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    if (mode === 'row') {
      suppress(); fg.style.transition = '';
      var open = base + dx < -70;
      fg.style.transform = open ? 'translateX(-150px)' : '';
      OPEN_ROW = open ? fg : null;
    } else if (mode === 'month') {
      suppress();
      var app = document.getElementById('app');
      if (Math.abs(dx) > 70) slide(dx < 0 ? 1 : -1, function () { shiftPeriod(dx < 0 ? 1 : -1); });
      else { app.style.transition = ''; app.style.transform = ''; app.style.opacity = '1'; }
    } else if (mode === 'pull') {
      ptr.style.transition = 'height .25s ease';
      if (dy * 0.45 >= 56 && navigator.onLine !== false) {
        ptr.style.height = '48px'; ptr.classList.add('spin');
        document.getElementById('ptrTx').textContent = 'Actualizando…';
        var t0 = Date.now(), end = function () {
          setTimeout(function () { ptr.classList.remove('spin'); ptr.style.height = '0'; }, Math.max(0, 600 - (Date.now() - t0)));
        };
        (loadData(false) || Promise.resolve()).then(end, end);
      } else {
        if (navigator.onLine === false) toast('Sin conexión');
        ptr.style.height = '0';
      }
    }
    mode = null;
  }, { passive: true });
})();

// The sheet follows your finger when you drag it down, and closes past a point.
(function () {
  var sheet = document.getElementById('sheet'), y0 = null, dy = 0, active = false;
  sheet.addEventListener('touchstart', function (e) {
    var fromHead = !!e.target.closest('.sh-head');
    if (fromHead || document.getElementById('shBody').scrollTop <= 0) { y0 = e.touches[0].clientY; dy = 0; active = false; } else y0 = null;
  }, { passive: true });
  sheet.addEventListener('touchmove', function (e) {
    if (y0 === null) return;
    dy = e.touches[0].clientY - y0;
    if (!active) { if (dy > 8) active = true; else if (dy < -4) { y0 = null; return; } else return; }
    e.preventDefault();
    sheet.style.transition = 'none';
    sheet.style.transform = 'translateY(' + Math.max(0, dy) + 'px)';
  }, { passive: false });
  sheet.addEventListener('touchend', function () {
    if (y0 === null || !active) { y0 = null; return; }
    sheet.style.transition = ''; sheet.style.transform = '';
    if (dy > 110) closeSheet();
    y0 = null; active = false;
  }, { passive: true });
})();

// ===================== Connection settings =====================
var CFG_KEY = 'mis-finanzas-config', CACHE_KEY = 'mis-finanzas-data', QUEUE_KEY = 'mis-finanzas-queue';
var SERVER = null;            // last data received from the sheet
var LOADING = false, LAST_LOAD = 0, AUTO_MINUTES = 5, CONFIRM_RESET = false;

function getCfg() { try { var c = JSON.parse(localStorage.getItem(CFG_KEY) || 'null'); return c && c.url && c.code ? c : null; } catch (e) { return null; } }
function setCfg(c) { localStorage.setItem(CFG_KEY, JSON.stringify(c)); }

// Calls a function of the Apps Script. Errors without internet carry e.offline = true.
function rpc(fn, args) {
  var cfg = getCfg();
  if (!cfg) return Promise.reject(new Error('Falta configurar la conexión.'));
  if (navigator.onLine === false) { var off = new Error('Sin conexión'); off.offline = true; return Promise.reject(off); }
  return fetch(cfg.url, { method: 'POST', body: JSON.stringify({ accion: 'app', codigo: cfg.code, fn: fn, args: args || [] }) })
    .then(function (r) { return r.text(); }, function () { var e = new Error('Sin conexión'); e.offline = true; throw e; })
    .then(function (t) {
      var j;
      try { j = JSON.parse(t); } catch (e) { throw new Error('La respuesta no es válida. Revisa la URL en Ajustes.'); }
      if (!j.ok) throw new Error(j.error || 'Error desconocido');
      return j.data;
    });
}

// ===================== Offline queue =====================
function queueGet() { try { return JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]'); } catch (e) { return []; } }
function queueSet(q) { try { localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); } catch (e) { /* storage full */ } }

// Sends pending movements. Each has an id, so resending never duplicates.
function flushQueue(fromSave) {
  var q = queueGet();
  if (!q.length) return Promise.resolve();
  if (navigator.onLine === false) {
    if (fromSave) toast('Guardado sin conexión. Se enviará cuando vuelva internet.');
    setStatus(statusText());
    return Promise.resolve();
  }
  busy(q.length > 1 ? 'Enviando ' + q.length + ' movimientos a tu hoja…' : 'Enviando a tu hoja…');
  return rpc('syncQueue', [q.map(function (i) { return { id: i.id, data: i.data }; })])
    .then(function (data) {
      hideToast();
      var res = {}; (data.syncResults || []).forEach(function (r) { res[r.id] = r; });
      var left = queueGet().filter(function (i) {
        var r = res[i.id];
        if (!r) return true;                 // added while sending: keep
        if (r.ok) return false;              // saved (or already there)
        i.error = r.error; return true;      // invalid: keep it so it can be fixed
      });
      queueSet(left);
      setData(data);
      LAST_LOAD = Date.now();
      setStatus(statusText());
      render();
      var failed = left.filter(function (i) { return i.error; }).length;
      if (failed) toast(failed + ' movimiento(s) no se pudieron enviar. Revísalos en Ajustes.');
      else toast(q.length > 1 ? q.length + ' movimientos sincronizados' : 'Movimiento registrado');
    })
    .catch(function (e) {
      hideToast();
      if (e.offline) { if (fromSave) toast('Guardado sin conexión. Se enviará cuando vuelva internet.'); }
      else toast('No se pudo sincronizar: ' + e.message);
      setStatus(statusText());
    });
}

// ===================== Local data =====================
// Server data + movements still in the queue, with expenses recalculated on the phone.
function setData(data) {
  SERVER = data;
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ saved: Date.now(), data: data })); } catch (e) { /* storage full */ }
  derive();
}
function derive() {
  if (!SERVER) { D = null; return; }
  var pend = queueGet().map(function (i, k) {
    var d = i.data || {};
    return { row: -(k + 1), qid: i.id, pending: true, error: i.error || '', day: d.fecha, tipo: d.tipo, cuenta: d.cuenta,
      destino: d.cuentaDestino || '', cat: d.categoria || '', desc: d.descripcion || '', monto: Number(d.monto) || 0 };
  });
  MEMO = {};
  D = Object.assign({}, SERVER, { movs: SERVER.movs.concat(pend) });
  var led = computeLedger(D.accounts, D.movs);
  D.paid = led.paid; D.pending = led.pending;
}
// Same rules as the script: card payments cover the oldest pending purchases first.
function computeLedger(accounts, movs) {
  var round = function (n) { return Math.round(n * 100) / 100; };
  var ord = function (r) { return r < 0 ? 1e9 - r : (r || 0); };   // pending ones go after the saved ones of the same day
  var byDate = function (a, b) { return a.day < b.day ? -1 : a.day > b.day ? 1 : ord(a.row) - ord(b.row); };
  var out = [], pending = {};
  movs.filter(function (m) { return m.tipo === 'Gasto'; }).forEach(function (m) {
    out.push({ day: m.day, cat: m.cat, medio: m.cuenta, monto: m.monto, desc: m.desc, origen: 'Gasto débito', row: m.row });
  });
  accounts.filter(function (a) { return a.type === 'Crédito'; }).forEach(function (card) {
    var queue = [];
    if (card.ini > 0) queue.push({ cat: 'Deuda anterior', desc: 'Deuda anterior de ' + card.name, rem: card.ini, row: null, day: '' });
    movs.filter(function (m) {
      return (m.cuenta === card.name && (m.tipo === 'Compra TC' || m.tipo === 'Reembolso TC')) || (m.tipo === 'Pago TC' && m.destino === card.name);
    }).sort(byDate).forEach(function (m) {
      if (m.tipo === 'Compra TC') queue.push({ cat: m.cat, desc: m.desc, rem: m.monto, row: m.row, day: m.day });
      else if (m.tipo === 'Reembolso TC') {
        var r = m.monto;
        var lower = function (list) { for (var i = list.length - 1; i >= 0 && r > 0; i--) { var t = Math.min(list[i].rem, r); list[i].rem = round(list[i].rem - t); r = round(r - t); } };
        lower(queue.filter(function (q) { return q.cat === m.cat; }));
        lower(queue);
        if (r > 0) out.push({ day: m.day, cat: m.cat, medio: card.name, monto: -r, desc: m.desc || 'Reembolso', origen: 'Reembolso TC', row: m.row });
      } else {
        var p = m.monto;
        queue.forEach(function (q) {
          if (p <= 0 || q.rem <= 0) return;
          var t = Math.min(q.rem, p); q.rem = round(q.rem - t); p = round(p - t);
          out.push({ day: m.day, cat: q.cat, medio: card.name, monto: t, desc: q.desc, origen: 'Pago TC', row: q.row });
        });
        if (p > 0) out.push({ day: m.day, cat: 'Pago sin compras registradas', medio: card.name, monto: p, desc: m.desc || 'Pago TC', origen: 'Pago TC', row: m.row });
      }
      for (var i = queue.length - 1; i >= 0; i--) if (queue[i].rem <= 0) queue.splice(i, 1);
    });
    pending[card.name] = queue.map(function (q) { return { cat: q.cat, desc: q.desc, monto: q.rem, row: q.row, day: q.day }; });
  });
  return { paid: out.sort(byDate), pending: pending };
}

// ===================== Loading and auto refresh =====================
function timeText(ms) { return new Date(ms).toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' }); }
function statusText() {
  var n = queueGet().length;
  var base = navigator.onLine === false ? 'Sin conexión · datos del celular' : (LAST_LOAD ? 'Actualizado ' + timeText(LAST_LOAD) : 'Datos del celular');
  return base + (n ? ' · ' + n + ' por sincronizar' : '');
}

function loadData(silent) {
  if (LOADING || !getCfg()) return;
  if (navigator.onLine === false) { setStatus(statusText()); return; }
  LOADING = true;
  var btn = document.getElementById('rbtn');
  btn.classList.add('spin');
  if (D) setStatus('Actualizando…');
  var done = function () { LOADING = false; btn.classList.remove('spin'); };
  var changed = true;
  var p = queueGet().length ? flushQueue(false) : rpc('getDashboardData', [SERVER && SERVER.version]).then(function (data) {
    if (data.unchanged && SERVER) {          // nothing new: only a tiny answer was downloaded
      changed = SERVER.today !== data.today;
      SERVER.today = data.today; saveLocal(); derive();
    } else setData(data);
    LAST_LOAD = Date.now();
  });
  return p.then(function () {
    done();
    if (!S.y && D) S = { y: Number(D.today.slice(0, 4)), m: Number(D.today.slice(5, 7)) };
    setStatus(statusText());
    if (changed && !INFLIGHT) render();
    if (!silent && document.getElementById('toastMsg').textContent === 'Sincronizando…') hideToast();
  }).catch(function (e) {
    done();
    if (!D) document.getElementById('app').innerHTML = '<div class="err">No se pudo cargar la información.<br>' + esc(e.message) + '</div>';
    else setStatus(e.offline || silent ? statusText() : 'No se pudo actualizar');
  });
}

window.addEventListener('online', function () { setStatus(statusText()); loadData(true); });
window.addEventListener('offline', function () { setStatus(statusText()); });
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && Date.now() - LAST_LOAD > 60 * 1000) loadData(true);
});
setInterval(function () { if (document.visibilityState === 'visible') loadData(true); }, AUTO_MINUTES * 60 * 1000);

// ===================== Setup and settings =====================
function setupHtml(inSheet) {
  return '<div class="' + (inSheet ? '' : 'setup') + '">' + (inSheet ? '' : '<h2>Conectar con tu hoja</h2>') +
    '<div class="small muted">Se hace una sola vez. Tus datos quedan guardados en este celular y se sincronizan con tu Google Sheet.</div>' +
    '<div class="field"><label>URL del script (la que termina en /exec)</label><input id="cfgUrl" autocapitalize="off" autocorrect="off" placeholder="https://script.google.com/macros/s/…/exec"></div>' +
    '<div class="field"><label>Código de acceso (APP_TOKEN)</label><input id="cfgCode" type="password" autocapitalize="off" autocorrect="off"></div>' +
    '<div class="errmsg" id="cfgErr"></div><button class="btn" id="cfgSave" data-act="saveCfg">Conectar</button></div>';
}
function saveCfg() {
  var url = document.getElementById('cfgUrl').value.trim(), code = document.getElementById('cfgCode').value.trim();
  var err = document.getElementById('cfgErr'), btn = document.getElementById('cfgSave');
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)) { err.textContent = 'La URL debe empezar por https://script.google.com/ y terminar en /exec.'; return; }
  if (!code) { err.textContent = 'Escribe el código de acceso.'; return; }
  var prev = localStorage.getItem(CFG_KEY);
  setCfg({ url: url, code: code });
  btn.disabled = true; btn.textContent = 'Conectando…'; err.textContent = '';
  rpc('getDashboardData', []).then(function (data) {
    setData(data); LAST_LOAD = Date.now();
    S = { y: Number(D.today.slice(0, 4)), m: Number(D.today.slice(5, 7)) };
    PAGE = 'inicio'; setStatus(statusText()); closeSheet(); render();
    toast('Conectado. Tus datos ya están en el celular.');
    flushQueue(false);
  }).catch(function (e) {
    if (prev) localStorage.setItem(CFG_KEY, prev); else localStorage.removeItem(CFG_KEY);
    btn.disabled = false; btn.textContent = 'Conectar';
    err.textContent = e.offline ? 'Necesitas internet para conectar la primera vez.' : e.message;
  });
}
function pageAjustes() {
  var q = queueGet(), cfg = getCfg();
  var qHtml = q.length ? q.map(function (i, k) {
    var d = i.data || {};
    return '<button class="qitem rowf tap" style="width:100%" data-act="editMov" data-arg="' + (-(k + 1)) + '"><span style="min-width:0"><div class="tt">' + esc(d.descripcion || d.categoria || d.tipo) + '</div>' +
      '<div class="sub">' + esc(d.tipo + ' · ' + d.cuenta + ' · ' + (d.fecha || '')) + '</div>' +
      (i.error ? '<div class="pend" style="color:var(--alert)">' + esc(i.error) + '</div>' : '<div class="pend">Esperando internet</div>') +
      '</span><span>' + money(d.monto) + '</span></button>';
  }).join('') : '<div class="empty">No hay movimientos pendientes. Todo está sincronizado.</div>';
  return '<div class="cols"><div>' +
    '<div class="sec"><div class="cap">Sincronización</div>' +
    '<div class="rowf" style="padding:6px 0"><span class="muted">Estado</span><span>' + (navigator.onLine === false ? 'Sin conexión' : 'Con conexión') + '</span></div>' +
    '<div class="rowf" style="padding:6px 0"><span class="muted">Última actualización</span><span>' + (LAST_LOAD ? timeText(LAST_LOAD) : '-') + '</span></div>' +
    '<div class="rowf" style="padding:6px 0"><span class="muted">Por sincronizar</span><span>' + q.length + '</span></div>' +
    '<button class="btn" data-act="syncNow">Sincronizar ahora</button></div>' +
    '<div class="sec"><div class="cap">Pendientes</div>' + qHtml + '</div></div>' +
    '<div><div class="sec"><div class="cap">Conexión</div>' +
    '<div class="small muted" style="word-break:break-all">' + esc(cfg ? cfg.url : '') + '</div>' +
    '<button class="btn2" data-act="changeCfg">Cambiar URL o código</button></div>' +
    '<div class="sec"><div class="cap">Este celular</div>' +
    '<div class="small muted">Borra la copia guardada en este celular. Tu hoja no cambia y los datos se vuelven a descargar.' + (q.length ? ' <b style="color:var(--alert)">Se perderían los ' + q.length + ' pendientes.</b>' : '') + '</div>' +
    '<button class="btn2 danger" data-act="resetLocal">' + (CONFIRM_RESET ? '¿Seguro? Toca otra vez' : 'Borrar datos del celular') + '</button></div></div></div>';
}
Object.assign(ACTIONS, {
  saveCfg: saveCfg,
  syncNow: function () { if (navigator.onLine === false) { toast('Sin conexión'); return; } busy('Sincronizando…'); loadData(false); },
  changeCfg: function () {
    var cfg = getCfg() || {};
    openSheet('Conexión', null, null, setupHtml(true));
    document.getElementById('cfgUrl').value = cfg.url || '';
  },
  resetLocal: function () {
    if (!CONFIRM_RESET) { CONFIRM_RESET = true; render(); return; }
    CONFIRM_RESET = false;
    localStorage.removeItem(CACHE_KEY); localStorage.removeItem(QUEUE_KEY);
    SERVER = null; D = null; LAST_LOAD = 0; render(); loadData(false);
  }
});

// ===================== Start =====================
(function () {
  Array.prototype.forEach.call(document.querySelectorAll('[data-ic]'), function (el) {
    el.outerHTML = icon(el.getAttribute('data-ic')).replace('class="svg"', 'class="svg ' + (el.className || '') + '"');
  });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  try {
    var c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
    if (c && c.data && c.data.movs) {
      setData(c.data);
      S = { y: Number(D.today.slice(0, 4)), m: Number(D.today.slice(5, 7)) };
    }
  } catch (e) { /* nothing saved yet */ }
  setStatus(getCfg() ? (D ? 'Datos del celular · ' + (navigator.onLine === false ? 'sin conexión' : 'actualizando…') : 'Cargando…') : '');
  render();
  loadData(false);
})();
